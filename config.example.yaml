feishu:
  appId: "${FEISHU_APP_ID}"
  appSecret: "${FEISHU_APP_SECRET}"
  userOpenId: "${FEISHU_USER_OPEN_ID}"
  # Set to false to accept messages and card actions from users other than the bot owner.
  respondToOwnerOnly: true
  # Fresh init and init --reset ask whether group messages require an @ mention.
  respondToAllGroupMessages: true
  # New-group templates. Supported placeholders: os, agent, project, taskname, date.
  # Use {date:yyyy-MM-dd} to override dateFormat for one date placeholder.
  groupNameFormat:
    project: "[{agent}] [{project}] {taskname}"
    projectless: "[{agent}] {taskname}"
    dateFormat: "MM-dd"
  # Use "timeline" to temporarily restore the original thinking-card layout.
  thinkingCardLayout: "grouped"

console:
  enabled: true

# Check npm latest once daily between 10:00 and 17:00 (server local time).
# Notify the owner privately; allow 60 seconds to cancel, then update when idle.
updates:
  enabled: true

# Signed, read-only pages for local files referenced in Agent replies.
fileViewer:
  enabled: true
  # The safe default only accepts connections from this computer.
  # Use 0.0.0.0 to accept LAN connections. Generated links then prefer
  # wired, Wi-Fi, other physical, and finally VPN interface addresses.
  host: "127.0.0.1"
  # 0 selects a free port once and reuses it for this Profile.
  port: 0
  # Override automatic selection for a domain, HTTPS proxy, or port mapping.
  # publicBaseUrl: "https://agentbot.example.com/files"

agents:
  codex:
    kind: "app-server"
    title: "Codex"
    command: "codex"
    args:
      - "app-server"
      - "--enable"
      - "goals"
      - "--listen"
      - "stdio://"
    env: {}
    # Updated automatically by the Provider, Model, Thinking, and Permission settings.
    defaults:
      # modelProvider: "openai"
      # model: "gpt-5"
      # reasoningEffort: "high"
      permissionMode: "auto"

  traex:
    kind: "app-server"
    title: "TraeX"
    command: "traex"
    args:
      - "app-server"
      - "--listen"
      - "stdio://"
    env: {}
    defaults:
      permissionMode: "auto"

defaults:
  agent: "codex"
  cwd: "."

storage:
  sqlitePath: "./data/agent-bot.sqlite"

logging:
  level: "info"
  # Runtime logs use this base name and are written as agent-bot.YYYY-MM-DD.log.
  path: "./logs/agent-bot.log"
